apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kube-news
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: kube-news
spec:
  # Acesso apenas interno ao cluster (a app o consome via DNS "postgres")
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
