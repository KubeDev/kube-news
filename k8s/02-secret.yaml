apiVersion: v1
kind: Secret
metadata:
  name: kube-news-secret
  namespace: kube-news
  labels:
    app.kubernetes.io/part-of: kube-news
type: Opaque
# stringData permite escrever os valores em texto puro (o Kubernetes
# converte para base64 automaticamente). Em produção, considere usar
# um gerenciador de segredos (Sealed Secrets, External Secrets, Vault...).
stringData:
  DB_USERNAME: "kubedevnews"
  DB_PASSWORD: "Pg#123"
  # Credenciais consumidas pelo container do Postgres
  POSTGRES_DB: "kubedevnews"
  POSTGRES_USER: "kubedevnews"
  POSTGRES_PASSWORD: "Pg#123"
