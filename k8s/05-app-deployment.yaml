apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-news
  namespace: kube-news
  labels:
    app.kubernetes.io/name: kube-news
    app.kubernetes.io/part-of: kube-news
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-news
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-news
        app.kubernetes.io/part-of: kube-news
    spec:
      containers:
        - name: kube-news
          # >>> Substitua pela sua imagem publicada no registry <<<
          image: marlonanderson/kube-news:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # Variáveis não sensíveis vêm do ConfigMap e as sensíveis do Secret
          envFrom:
            - configMapRef:
                name: kube-news-config
            - secretRef:
                name: kube-news-secret
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
